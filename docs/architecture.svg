<rect x="200" y="840" width="380" height="100" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
<text x="390.0" y="868" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle">H2 Database</text>
<text x="390.0" y="888" font-family="Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#0f766e" text-anchor="middle" font-style="italic">in-memory, no URL/console configured</text>
<text x="390.0" y="906" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="400" fill="#334155" text-anchor="middle">reseeded on every restart (DataInitializer:</text>
<text x="390.0" y="920" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="400" fill="#334155" text-anchor="middle">1 category, 1 product)</text>
<rect x="680" y="840" width="380" height="100" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
<text x="870.0" y="868" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Redis</text>
<text x="870.0" y="888" font-family="Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#64748b" text-anchor="middle" font-style="italic">dependency + RedisTemplate bean present</text>
