<text x="680.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">E-Commerce Product Management System — Architecture</text>
<text x="680.0" y="55" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">Static admin frontend, a layered Spring Boot REST API, and an in-memory H2 database</text>
<rect x="480" y="84" width="400" height="66" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="680.0" y="110" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">Browser — Admin User</text>
<text x="680.0" y="130" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">manages products, categories, inventory, price history</text>
<rect x="430" y="182" width="500" height="90" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="680.0" y="206" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="middle">Static Frontend</text>
<text x="680.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#4338ca" text-anchor="middle" font-style="italic">HTML + jQuery, Material Design-inspired CSS (not the MUI React library)</text>
<text x="680.0" y="244" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#6366a8" text-anchor="middle" font-style="italic">4 sections: Products · Categories · Inventory · Price History</text>
<text x="680.0" y="260" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="400" fill="#9494c0" text-anchor="middle" font-style="italic">API_URL hardcoded to http://localhost:8081/api in app.js</text>
<rect x="90" y="320" width="1180" height="460" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="114" y="350" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start">Spring Boot Backend (single process)</text>
<text x="114" y="369" font-family="Helvetica, Arial, sans-serif" font-size="10.3" font-weight="400" fill="#3b5aa6" text-anchor="start" font-style="italic">Spring Boot 3.2.5 · Java 17 · REST + JSON · no API documentation (Swagger/OpenAPI not configured)</text>
<rect x="114" y="386" width="1132" height="34" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="680.0" y="408" font-family="Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#854d0e" text-anchor="middle">Spring Security is on the classpath, but SecurityConfig permits every request — no authentication is enforced</text>
<rect x="114.0" y="440" width="271.0" height="78" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="249.5" y="458" font-family="Helvetica, Arial, sans-serif" font-size="9.6" font-weight="700" fill="#1e3a8a" text-anchor="middle">ProductController</text>
<text x="249.5" y="474" font-family="Helvetica, Arial, sans-serif" font-size="8.2" font-weight="400" fill="#334155" text-anchor="middle">/api/products</text>
<text x="249.5" y="484.5" font-family="Helvetica, Arial, sans-serif" font-size="8.2" font-weight="400" fill="#334155" text-anchor="middle">CRUD, search, category filter,</text>
<text x="249.5" y="495.0" font-family="Helvetica, Arial, sans-serif" font-size="8.2" font-weight="400" fill="#334155" text-anchor="middle">bulk update, inventory update</text>
<rect x="401.0" y="440" width="271.0" height="78" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="536.5" y="458" font-family="Helvetica, Arial, sans-serif" font-size="9.6" font-weight="700" fill="#1e3a8a" text-anchor="middle">CategoryController</text>
<text x="536.5" y="474" font-family="Helvetica, Arial, sans-serif" font-size="8.2" font-weight="400" fill="#334155" text-anchor="middle">/api/categories</text>
<text x="536.5" y="484.5" font-family="Helvetica, Arial, sans-serif" font-size="8.2" font-weight="400" fill="#334155" text-anchor="middle">CRUD only</text>
<rect x="688.0" y="440" width="271.0" height="78" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="823.5" y="458" font-family="Helvetica, Arial, sans-serif" font-size="9.6" font-weight="700" fill="#1e3a8a" text-anchor="middle">PriceHistoryController</text>
<text x="823.5" y="474" font-family="Helvetica, Arial, sans-serif" font-size="8.2" font-weight="400" fill="#334155" text-anchor="middle">/api/price-history</text>
<text x="823.5" y="484.5" font-family="Helvetica, Arial, sans-serif" font-size="8.2" font-weight="400" fill="#334155" text-anchor="middle">read-only — no write endpoint</text>
<rect x="975.0" y="440" width="271.0" height="78" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="1110.5" y="458" font-family="Helvetica, Arial, sans-serif" font-size="9.6" font-weight="700" fill="#1e3a8a" text-anchor="middle">ProductBulkController</text>
<text x="1110.5" y="474" font-family="Helvetica, Arial, sans-serif" font-size="8.2" font-weight="400" fill="#334155" text-anchor="middle">/api/products/bulk</text>
<text x="1110.5" y="484.5" font-family="Helvetica, Arial, sans-serif" font-size="8.2" font-weight="400" fill="#334155" text-anchor="middle">bulk update (PUT)</text>
<text x="114" y="534" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">no @Valid / Bean Validation · no @RestControllerAdvice — controllers return JPA entities directly, no DTOs</text>
<rect x="114.0" y="552" width="366.6666666666667" height="86" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="297.33333333333337" y="570" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">ProductService</text>
<text x="297.33333333333337" y="586" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">plain CRUD delegation</text>
<text x="297.33333333333337" y="596.5" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">@Cacheable on getProductById</text>
<text x="297.33333333333337" y="607.0" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">(inert — cache type=none)</text>
<text x="297.33333333333337" y="617.5" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">no price-change -&gt; history logic</text>
<rect x="496.6666666666667" y="552" width="366.6666666666667" height="86" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="680.0" y="570" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">CategoryService</text>
<text x="680.0" y="586" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">plain CRUD delegation</text>
<text x="680.0" y="596.5" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">self-referential parent/</text>
<text x="680.0" y="607.0" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">child, no tree query</text>
<rect x="879.3333333333334" y="552" width="366.6666666666667" height="86" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="1062.6666666666667" y="570" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">PriceHistoryService</text>
<text x="1062.6666666666667" y="586" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">read-only: list by product id</text>
<text x="1062.6666666666667" y="596.5" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">nothing in the codebase</text>
<text x="1062.6666666666667" y="607.0" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">writes a PriceHistory row</text>
<rect x="114.0" y="668" width="366.6666666666667" height="66" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="297.33333333333337" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">ProductRepository</text>
<text x="297.33333333333337" y="702" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">findByNameContainingIgnoreCase</text>
<text x="297.33333333333337" y="712.5" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">findByCategoryId</text>
<rect x="496.6666666666667" y="668" width="366.6666666666667" height="66" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="680.0" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">CategoryRepository</text>
<text x="680.0" y="702" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">plain JpaRepository, no</text>
<text x="680.0" y="712.5" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">custom query methods</text>
<rect x="879.3333333333334" y="668" width="366.6666666666667" height="66" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="1062.6666666666667" y="686" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">PriceHistoryRepository</text>
<text x="1062.6666666666667" y="702" font-family="Helvetica, Arial, sans-serif" font-size="8.3" font-weight="400" fill="#334155" text-anchor="middle">findByProductId</text>
