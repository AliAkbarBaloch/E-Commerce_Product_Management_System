<rect x="688.0" y="155.0" width="34.4" height="19.4" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="688.0" y="166.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">HTTP</text>
