<text x="870.0" y="910" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.4">CONFIGURED, NOT ACTIVE</text>
<text x="870.0" y="930" font-family="Helvetica, Arial, sans-serif" font-size="8.6" font-weight="400" fill="#334155" text-anchor="middle">spring.cache.type=none disables it at runtime</text>
